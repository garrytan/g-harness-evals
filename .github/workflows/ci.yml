# Keyless CI. Nothing here needs a secret: typecheck, unit tests for the vendored
# statistics kit and the preregistration checker, the documentation link check and the
# hub-fragment check (scripts/fold-hub-fragments.ts --check) in one job (an estimated
# 9 to 11 minutes; with the preregistration-order step it took 12 to 15 minutes in late
# October 2026); the preregistration-order check in a
# parallel job of its own (about 5 minutes); and a docker job
# (internal-task) that builds the gbrain sidecar image from the pull request's own checkout
# and runs tests/gbrain-image.test.ts against it, about 15 minutes, still keyless,
# run only when a file the image or its tests depend on changed (the `changes` job).
# The public-export job exports this tree as the public repository would get it and checks it keyless (36 to over 50
# minutes, in parallel). A docs-only change (scripts/ci/docs-only.ts, run from the base commit before anything from the
# head is installed: every changed path is on its list of human-facing pages, none of them pinned) skips the checks
# job's typecheck and tests and runs the docs checks instead (the two tests that read the README and every Markdown page,
# the link and hub-fragment checks), and the job reports success, so every required check reports.
# Paid runs (live harness trials) are manual, run on a trusted pushed SHA with a
# reserved budget, and land receipts in the repo. Actions are pinned to commit SHAs;
# Bun is pinned by bun-version.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# No job writes to the repository: the token can only read it.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      # The base commit's copy decides, with bun reading no bunfig.toml, tsconfig.json or .env from the head; anything but a
      # clean docs_only=true (no base copy, an error, an unknown base) means the full run.
      - name: Docs-only change
        id: docs
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          d="$RUNNER_TEMP/docs-only"
          mkdir -p "$d" && : > "$d/bunfig.toml" && echo '{}' > "$d/tsconfig.json"
          verdict=docs_only=false
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && ! "$BASE" =~ ^0+$ ]] && git show "$BASE:scripts/ci/docs-only.ts" > "$d/docs-only.ts" 2>/dev/null; then
            verdict=$(bun --no-env-file --config="$d/bunfig.toml" --tsconfig-override="$d/tsconfig.json" "$d/docs-only.ts" --base "$BASE" --head "$HEAD_SHA" --tree HEAD) || verdict=docs_only=false
          fi
          [ "$verdict" = docs_only=true ] || verdict=docs_only=false
          echo "$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = docs_only=true ]; then echo "Docs-only change: typecheck and tests skipped; the docs checks ran." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      # scripts/ci/docs-only.ts DOC_TESTS: the tests that read the README and every Markdown page.
      - name: Docs checks (docs-only change)
        if: steps.docs.outputs.docs_only == 'true'
        run: bun test tests/version.test.ts tests/scoreboard.test.ts tests/readme-settings.test.ts
      - name: Typecheck
        if: steps.docs.outputs.docs_only != 'true'
        run: bunx tsc --noEmit
      - name: Tests (statistics kit, preregistration checker)
        if: steps.docs.outputs.docs_only != 'true'
        run: bash scripts/run-tests.sh --junit-dir "$RUNNER_TEMP/junit"
      # gstack's CI carry (.gstack/pregate.json run_profiles "ci/checks", ship_lanes_from): this job's tested-tree record
      # lets /ship and gstack-pregate count the "bun test tests/" lane as passed at the identical tree instead of
      # running it again. Written only after the tests pass.
      - name: Tested tree record (tree.json)
        if: steps.docs.outputs.docs_only != 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/ci-tree-json.ts --junit "$RUNNER_TEMP/junit/builders.xml" --junit "$RUNNER_TEMP/junit/main.xml" --junit "$RUNNER_TEMP/junit/serial.xml" --out "$RUNNER_TEMP/checks-tree/tree.json"
      - name: Upload the tested tree
        if: steps.docs.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-tree
          path: ${{ runner.temp }}/checks-tree/tree.json
          if-no-files-found: error
      - name: Private spend tests (program spend renderer; the public copy has no private/)
        run: if [ -d private/spend ]; then bun test private/spend/ --timeout=30000; fi
      - name: Documentation links
        run: python3 scripts/check-links.py
      - name: Hub fragments (TODOS.md matches todos.d/, or its fold is still pending at land)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bun scripts/fold-hub-fragments.ts --check --base "$BASE"

  # bun run verify (docs/verify.md): rebuild every published run's analysis files from its committed receipts and fail on
  # any value that differs, then rebuild the README rankings and scoreboard page from them and check the receipts'
  # hashes. Keyless: every rebuild step runs with an empty environment. It needs full git history: the analysis scripts
  # look up the commit that added each run's preregistration and refuse to run in a shallow clone.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Rebuild every published analysis from its receipts
        run: bun run verify

  # Every experiment in docs/benchmarks/preregistrations.json (and preregistrations.d/)
  # must have its preregistration committed before any of its result files. It reads git
  # history, so it needs the full clone. The private repository runs the private check, and
  # every other copy (the public repository) runs --public, which reads the export's
  # attestation map (docs/benchmarks/prereg-attestations.json) and fails when it is missing.
  # On a pull request it also fails when the pull request changes that map (--base), because
  # only the export writes it and the check trusts it. It compares against the first parent of
  # the pull request's merge commit (the base branch tip GitHub merged into), never the event's
  # base.sha, which can be stale; fetch-depth 0 keeps both parents in the checkout, and a
  # checkout without them fails the job rather than falling back or skipping.
  # The job runs in every repository, because GitHub reports a job skipped by `if:` as passed.
  # The public check took 41 seconds on the public main's 69 experiments on a 4-core machine;
  # most of the timeout is for the full clone.
  prereg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Preregistration order
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$REPOSITORY" = garrytan/harness-evals ]; then exec bun runner/prereg/prereg.ts; fi
          if [ "$EVENT" != pull_request ]; then exec bun runner/prereg/prereg.ts --public; fi
          git rev-parse --verify -q HEAD^2 >/dev/null || { echo "prereg: HEAD is not the pull request's merge commit"; exit 1; }
          base=$(git rev-parse --verify -q HEAD^1) || { echo "prereg: the merge commit's base parent is not in this checkout"; exit 1; }
          exec bun runner/prereg/prereg.ts --public --base "$base"

  # The public export (publication/README.md) of this pull request's tree, keyless: every export gate on the tree (the
  # pass rule is scripts/public-export/ci-gate.ts), then the export tree committed on top of the public repository's
  # history, where a keyless install, typecheck, link check and test run must pass, so a change that would break the
  # public repository fails here and not at the next export. It uploads tree-report.md only; the report JSON and the
  # held-*.tsv files carry held codes and stay on the runner.
  public-export:
    if: github.repository == 'garrytan/harness-evals'
    runs-on: ubuntu-latest
    # Over 41 runs on 2026-11-12 and 13 the export tree step took 12 to 23 minutes, the keyless step 19 to 25 and the rest
    # up to 9. A 50 minute limit cancelled 5 of them, 2 after every step had passed; 70 is 13 minutes above the slowest
    # steps added up.
    timeout-minutes: 70
    steps:
      # The job holds a full-history checkout, the export stage, the public clone and docker builds at once, and the
      # runner's free disk ran out on a results PR with 526 MB of receipts (#333). Remove preinstalled toolchains this
      # job never uses before the checkout; df -h before and after shows what it freed.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Cache the pinned export tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/harness-evals/public-export
          key: >-
            public-export-tools-${{ hashFiles('scripts/public-export/tools.lock') }}
      - name: Pinned export tools (checksum-verified)
        run: bun scripts/public-export/export.ts tools
      # The export reads the source's identities from refs/heads/main, which a pull request checkout does not create. The
      # public main is cloned first: the reference-overlap gate drops only the common phrases its harness captures, world/,
      # harnesses/ and tasks/ hold, never those of the tree being exported.
      - name: Export tree (keyless; exit 1 is a gate verdict the next step reads)
        run: |
          git clone -q --single-branch --branch main --no-tags https://github.com/garrytan/g-harness-evals.git "$RUNNER_TEMP/public"
          git update-ref refs/heads/main HEAD
          rc=0
          bun scripts/public-export/export.ts tree --source . --rev HEAD --cutover "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out "$RUNNER_TEMP/export" --no-trufflehog --common-from "$RUNNER_TEMP/public" || rc=$?
          [ "$rc" -le 1 ]
      - name: Export gates
        run: bun scripts/public-export/ci-gate.ts --report "$RUNNER_TEMP/export/report/tree-report.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the export report (Markdown only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-export-report
          path: ${{ runner.temp }}/export/report/tree-report.md
          if-no-files-found: ignore
      # The export commit becomes the clone's main, as it would be after the push, so a test that reads its base from main or
      # origin/main (the sealed governance checks) compares the export with itself, not with the public copy before it.
      - name: The export tree on top of the public history
        run: |
          cd "$RUNNER_TEMP/public"
          git fetch -q --no-tags "$RUNNER_TEMP/export/stage" main
          tip=$(git -c user.name=ci -c user.email=ci@invalid commit-tree FETCH_HEAD^{tree} -p HEAD -m "export tree of $GITHUB_SHA")
          git checkout -q -B main "$tip"
          git update-ref -d refs/remotes/origin/main
      - name: Keyless install, typecheck, links and tests on the export tree
        working-directory: ${{ runner.temp }}/public
        run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 bash -c 'bun install --frozen-lockfile && bunx tsc --noEmit && python3 scripts/check-links.py && bun test tests/ --timeout=30000'

  # Which paths changed, so the docker job runs only when the sidecar image, its build, the fake harness it drives or the
  # image tests could have changed: a pull request is compared with its base, a push to main with the commit before it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gbrain: ${{ steps.diff.outputs.gbrain }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "gbrain=true" >> "$GITHUB_OUTPUT"; echo "no base commit; running the docker job"; exit 0; fi
          changed=$(git diff --name-only "$BASE" "$GITHUB_SHA" -- gbrain/ 'world/services/gbrain*' 'runner/trial/gbrain*' 'tests/gbrain*' harnesses/_fake/ scripts/build-gbrain-image.sh .github/workflows/ci.yml)
          if [ -n "$changed" ]; then echo "gbrain=true" >> "$GITHUB_OUTPUT"; printf 'docker job runs; changed:\n%s\n' "$changed"; else echo "gbrain=false" >> "$GITHUB_OUTPUT"; echo "docker job skipped: no gbrain path changed since $BASE"; fi

  # The sidecar image from this checkout (gbrain at the pin, four keyword brains, the install bundle), then the image tests
  # with HE_GBRAIN_IMAGE set, which fail rather than skip when the image is missing. No secret: the build is keyless and the
  # embedded-brain case runs against an in-test fake embedder only when HE_GBRAIN_EMBEDDED_BRAIN names a brain, which it
  # does not here (that brain is built through the metering proxy with a key, scripts/build-gbrain-image.sh --embedded).
  docker-e2e:
    needs: changes
    if: needs.changes.outputs.gbrain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build the gbrain sidecar image from this checkout
        run: scripts/build-gbrain-image.sh --tag "harness-eval/gbrain:pr-${GITHUB_SHA::12}" --out /tmp/gbrain-build
      - name: Image tests
        run: HE_GBRAIN_IMAGE="harness-eval/gbrain:pr-${GITHUB_SHA::12}" bun test tests/gbrain-image.test.ts
      - name: Build log on failure
        if: failure()
        run: tail -60 /tmp/gbrain-build/build.log || true
