# Keyless CI. Nothing here needs a secret: typecheck, unit tests for the vendored
# statistics kit and the preregistration checker, the documentation link check and the
# hub-fragment check (scripts/fold-hub-fragments.ts --check) in one job (an estimated
# 9 to 11 minutes; with the preregistration-order step it took 12 to 15 minutes in late
# October 2026); the preregistration-order check in a
# parallel job of its own (about 5 minutes); and a docker job
# (internal-task) that builds the gbrain sidecar image from the pull request's own checkout
# and runs tests/gbrain-image.test.ts against it, about 15 minutes, still keyless,
# run only when a file the image or its tests depend on changed (the `changes` job).
# The public-export job exports this tree as the public repository would get it and checks it keyless (36 to over 50
# minutes, in parallel). A docs-only change (scripts/ci/docs-only.ts, run from the base commit before anything from the
# head is installed: every changed path is on its list of human-facing pages, none of them pinned) skips the checks
# job's typecheck and tests and runs the docs checks instead (the two tests that read the README and every Markdown page,
# the link and hub-fragment checks), and the job reports success, so every required check reports.
# Test selection (pull requests only): the checks job runs only the test files the change can affect, picked by the base
# commit's copy of scripts/ci/select-tests.ts from the runtime test map the nightly test-map workflow publishes on the
# orphan branch ci-test-map (fetched from this repository, never from the pull request). It runs the full suite when the
# map is missing, unreadable, over 3 days old or traced at a commit that is not an ancestor of the base, when a changed
# path is package.json, bun.lock, bunfig.toml, tsconfig.json, .github/**, tests/setup/**, scripts/run-tests.sh or
# scripts/ci/**, when a changed file of any kind is one the map ties to no test, or when the selection comes out empty.
# It runs only in garrytan/harness-evals: selection is safe only because ubicloud/checks runs the full suite on every
# pull request before it can merge, and the public copy has no such check; a selected run is a fast early signal, not the gate, and it
# writes no tree.json, so gstack's CI carry never counts it as a full "bun test tests/" pass. A push to main always runs
# everything. To force the full suite on a pull request, put [full tests] in the head commit's message or add the
# full-tests label before the next push.
# main's ruleset requires the ci-result job, which always runs and fails when any job above failed or was cancelled:
# GitHub counts a skipped required job as passed, so docker-e2e (skipped when no gbrain path changed, and also when the
# changes job fails) is never required by name.
# Paid runs (live harness trials) are manual, run on a trusted pushed SHA with a
# reserved budget, and land receipts in the repo. Actions are pinned to commit SHAs;
# Bun is pinned by bun-version.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# No job writes to the repository: the token can only read it.
permissions:
  contents: read

# Runners: in garrytan/harness-evals every job runs on a Ubicloud runner (ubuntu 24.04, the image GitHub's ubuntu-latest
# uses), because GitHub-hosted minutes on this private repository draw on an Actions budget that ran out on 2026-11-19,
# and Ubicloud runners do not. The exported public copy keeps ubuntu-latest, which is free for public repositories and
# never puts a fork's pull request on paid runners. public-export runs only here, so it names the Ubicloud runner directly.
# Artifact storage draws on the same budget and refuses uploads while it is spent, so the two artifact uploads below
# (the tested tree and the export report) may fail without failing their job; the tested tree is in the checks job's log
# as well.
jobs:
  checks:
    # 8 vCPUs: scripts/run-tests.sh runs one test worker per core, and the tests are most of this job's time.
    runs-on: ${{ github.repository == 'garrytan/harness-evals' && 'ubicloud-standard-8-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      # The base commit's copy decides, with bun reading no bunfig.toml, tsconfig.json or .env from the head; anything but a
      # clean docs_only=true (no base copy, an error, an unknown base) means the full run.
      - name: Docs-only change
        id: docs
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          d="$RUNNER_TEMP/docs-only"
          mkdir -p "$d" && : > "$d/bunfig.toml" && echo '{}' > "$d/tsconfig.json"
          verdict=docs_only=false
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && ! "$BASE" =~ ^0+$ ]] && git show "$BASE:scripts/ci/docs-only.ts" > "$d/docs-only.ts" 2>/dev/null; then
            verdict=$(bun --no-env-file --config="$d/bunfig.toml" --tsconfig-override="$d/tsconfig.json" "$d/docs-only.ts" --base "$BASE" --head "$HEAD_SHA" --tree HEAD) || verdict=docs_only=false
          fi
          [ "$verdict" = docs_only=true ] || verdict=docs_only=false
          echo "$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = docs_only=true ]; then echo "Docs-only change: typecheck and tests skipped; the docs checks ran." >> "$GITHUB_STEP_SUMMARY"; fi
      # The merge lane's VM check (scripts/ubicloud/checks.sh) and the counted shards run on stock Ubuntu 24.04 Ubicloud VMs,
      # whose git is the Ubuntu archive's 2.43. This runner image adds a newer git from a PPA, so the tests here could pass on
      # a git the VMs don't have: a test using `git init --ref-format=reftable` (git 2.45 and later) did. Swap in the
      # archive's git so this job runs the suite on the VMs' git.
      - name: Ubuntu archive git, as on the Ubicloud VMs
        if: github.repository == 'garrytan/harness-evals' && steps.docs.outputs.docs_only != 'true'
        run: |
          for f in $(grep -l git-core /etc/apt/sources.list.d/* 2>/dev/null); do sudo rm -f "$f"; done
          if [ ! -f /etc/apt/sources.list.d/ubuntu.sources ]; then echo "No /etc/apt/sources.list.d/ubuntu.sources: cannot refresh only the Ubuntu archive" >&2; exit 1; fi
          for i in 1 2 3; do sudo apt-get update -qq --error-on=any -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- && break; [ "$i" = 3 ] && exit 1; sleep $((i * 10)); done
          if apt-cache madison git | grep -q launchpad; then echo "A git PPA is still in the apt sources" >&2; exit 1; fi
          v=$(apt-cache madison git | awk -F'|' 'NR == 1 { gsub(/ /, "", $2); print $2 }')
          sudo apt-get install -y -qq -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60 --allow-downgrades --no-install-recommends "git=$v" "git-man=$v" > /dev/null
          u=${v#*:}
          echo "git $(git --version | cut -d' ' -f3) (archive $v), node $(node --version), $(docker --version), $(python3 --version)"
          [ "$(git --version)" = "git version ${u%%-*}" ]
      # Pull requests only. The base copy of scripts/ci/select-tests.ts decides, with bun reading no bunfig.toml,
      # tsconfig.json or .env from the head, from the map on this repository's ci-test-map branch. The base is the merge
      # commit's first parent (the base branch tip GitHub merged into) and the head is the merge commit itself, so the list
      # names files in the tree the tests run in; anything but a clean list means the full run.
      - name: Test selection (pull requests)
        id: select
        if: github.repository == 'garrytan/harness-evals' && github.event_name == 'pull_request' && steps.docs.outputs.docs_only != 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-tests') }}
        run: |
          d="$RUNNER_TEMP/select-tests"
          mkdir -p "$d" && : > "$d/bunfig.toml" && echo '{}' > "$d/tsconfig.json"
          echo all > "$d/selection.txt"
          base=$(git rev-parse --verify -q HEAD^1 || true)
          head=$(git rev-parse --verify -q HEAD^2 || true)
          if [ "$FULL_LABEL" = true ]; then
            echo "full run: the full-tests label"
          elif [ "$HEAD_REF" = ci-test-map ]; then
            echo "full run: the pull request's own branch is ci-test-map"
          elif [ -z "$base" ] || [ -z "$head" ]; then
            echo "full run: HEAD is not the pull request's merge commit"
          elif git log -1 --format=%B "$head" | grep -qiF '[full tests]'; then
            echo "full run: [full tests] in the head commit's message"
          elif ! git show "$base:scripts/ci/select-tests.ts" > "$d/select-tests.ts" 2>/dev/null; then
            echo "full run: the base has no scripts/ci/select-tests.ts"
          elif ! git fetch -q --no-tags origin +refs/heads/ci-test-map:refs/ci-test-map/map 2>/dev/null; then
            echo "full run: this repository has no ci-test-map branch"
          else
            bun --no-env-file --config="$d/bunfig.toml" --tsconfig-override="$d/tsconfig.json" "$d/select-tests.ts" --base "$base" --head HEAD --map-rev refs/ci-test-map/map > "$d/selection.txt" || echo all > "$d/selection.txt"
          fi
          if [ "$(head -n1 "$d/selection.txt")" = all ]; then
            echo "selected=false" >> "$GITHUB_OUTPUT"
          else
            echo "selected=true" >> "$GITHUB_OUTPUT"
            { echo "Test selection: $(grep -c . "$d/selection.txt") test file(s) ran; ubicloud/checks runs the full suite before merge."; sed 's/^/- /' "$d/selection.txt"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      # scripts/ci/docs-only.ts DOC_TESTS: the tests that read the README and every Markdown page.
      - name: Docs checks (docs-only change)
        if: steps.docs.outputs.docs_only == 'true'
        run: bun test tests/version.test.ts tests/scoreboard.test.ts tests/readme-settings.test.ts
      - name: Typecheck
        if: steps.docs.outputs.docs_only != 'true'
        run: bunx tsc --noEmit
      - name: Tests (statistics kit, preregistration checker)
        if: steps.docs.outputs.docs_only != 'true' && steps.select.outputs.selected != 'true'
        run: bash scripts/run-tests.sh --junit-dir "$RUNNER_TEMP/junit"
      - name: Selected tests (pull request)
        if: steps.docs.outputs.docs_only != 'true' && steps.select.outputs.selected == 'true'
        run: bash scripts/run-tests.sh --only "$RUNNER_TEMP/select-tests/selection.txt"
      # gstack's CI carry (.gstack/pregate.json run_profiles "ci/checks", ship_lanes_from): this job's tested-tree record
      # lets /ship and gstack-pregate count the "bun test tests/" lane as passed at the identical tree instead of
      # running it again. Written only after the tests pass, and only for a full run: a selected run writes no tree.json, so
      # the carry never counts it as the whole lane.
      - name: Tested tree record (tree.json)
        if: steps.docs.outputs.docs_only != 'true' && steps.select.outputs.selected != 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/ci-tree-json.ts --junit "$RUNNER_TEMP/junit/builders.xml" --junit "$RUNNER_TEMP/junit/proxy.xml" --junit "$RUNNER_TEMP/junit/main.xml" --junit "$RUNNER_TEMP/junit/serial.xml" --out "$RUNNER_TEMP/checks-tree/tree.json"
      # The same record as one GSTACK_TREE_JSON line (the artifact name and the file in base64) in this step's own log, for
      # a gstack that reads it from there when the run has no artifact (internal-task-a, internal-task-b): the job log is GitHub's own
      # record of this job and attempt, like the artifact. It is its own step, after the tests and outside their process,
      # because gstack reads the line only from the step its run profile names (tree_log_step). Keep the step's name as it
      # is. The sleeps keep the line well inside the step's own time window: gstack binds the line to the step by its log
      # timestamp against the step's start and finish times, which GitHub reports to the second and which ran about 1.5 s
      # behind the log's stamps on a Ubicloud runner (run 44845717681), so 1 s before and 2 s after was refused.
      - name: Tested tree record in the log
        if: steps.docs.outputs.docs_only != 'true' && steps.select.outputs.selected != 'true'
        run: sleep 3 && echo "GSTACK_TREE_JSON checks-tree $(base64 -w0 "$RUNNER_TEMP/checks-tree/tree.json")" && sleep 5
      - name: Upload the tested tree
        if: steps.docs.outputs.docs_only != 'true' && steps.select.outputs.selected != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-tree
          path: ${{ runner.temp }}/checks-tree/tree.json
          if-no-files-found: error
      - name: Private spend tests (program spend renderer; the public copy has no private/)
        run: if [ -d private/spend ]; then bun test private/spend/ --timeout=30000; fi
      - name: Documentation links
        run: python3 scripts/check-links.py
      - name: Hub fragments (TODOS.md matches todos.d/, or its fold is still pending at land)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bun scripts/fold-hub-fragments.ts --check --base "$BASE"

  # bun run verify (docs/verify.md): rebuild every published run's analysis files from its committed receipts and fail on
  # any value that differs, then rebuild the README rankings and scoreboard page from them and check the receipts'
  # hashes. Keyless: every rebuild step runs with an empty environment. It needs full git history: the analysis scripts
  # look up the commit that added each run's preregistration and refuse to run in a shallow clone.
  verify:
    runs-on: ${{ github.repository == 'garrytan/harness-evals' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Rebuild every published analysis from its receipts
        run: bun run verify

  # Every experiment in docs/benchmarks/preregistrations.json (and preregistrations.d/)
  # must have its preregistration committed before any of its result files. It reads git
  # history, so it needs the full clone. The private repository runs the private check, and
  # every other copy (the public repository) runs --public, which reads the export's
  # attestation map (docs/benchmarks/prereg-attestations.json) and fails when it is missing.
  # On a pull request it also fails when the pull request changes that map (--base), because
  # only the export writes it and the check trusts it. It compares against the first parent of
  # the pull request's merge commit (the base branch tip GitHub merged into), never the event's
  # base.sha, which can be stale; fetch-depth 0 keeps both parents in the checkout, and a
  # checkout without them fails the job rather than falling back or skipping.
  # The job runs in every repository, because GitHub reports a job skipped by `if:` as passed.
  # The public check took 41 seconds on the public main's 69 experiments on a 4-core machine;
  # most of the timeout is for the full clone.
  prereg:
    runs-on: ${{ github.repository == 'garrytan/harness-evals' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Preregistration order
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$REPOSITORY" = garrytan/harness-evals ]; then exec bun runner/prereg/prereg.ts; fi
          if [ "$EVENT" != pull_request ]; then exec bun runner/prereg/prereg.ts --public; fi
          git rev-parse --verify -q HEAD^2 >/dev/null || { echo "prereg: HEAD is not the pull request's merge commit"; exit 1; }
          base=$(git rev-parse --verify -q HEAD^1) || { echo "prereg: the merge commit's base parent is not in this checkout"; exit 1; }
          exec bun runner/prereg/prereg.ts --public --base "$base"

  # The public export (publication/README.md) of this pull request's tree, keyless: every export gate on the tree (the
  # pass rule is scripts/public-export/ci-gate.ts), then the export tree committed on top of the public repository's
  # history, where a keyless install, typecheck, link check and test run must pass, so a change that would break the
  # public repository fails here and not at the next export. It uploads tree-report.md only; the report JSON and the
  # held-*.tsv files carry held codes and stay on the runner.
  public-export:
    if: github.repository == 'garrytan/harness-evals'
    runs-on: ubicloud-standard-8-ubuntu-2404
    # Over 41 runs on 2026-11-12 and 13 the export tree step took 12 to 23 minutes, the keyless step 19 to 25 and the rest
    # up to 9. A 50 minute limit cancelled 5 of them, 2 after every step had passed; 70 is 13 minutes above the slowest
    # steps added up.
    timeout-minutes: 70
    steps:
      # The job holds a full-history checkout, the export stage, the public clone and docker builds at once, and the
      # runner's free disk ran out on a results PR with 526 MB of receipts (#333). Remove preinstalled toolchains this
      # job never uses before the checkout; df -h before and after shows what it freed.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # The public main's clone (about 40 s) runs in the background while the checkout, the install and the tools step run;
      # the export step waits for it and fails when it failed.
      - name: Clone the public main in the background
        run: |
          ( rc=0; git clone -q --single-branch --branch main --no-tags https://github.com/garrytan/g-harness-evals.git "$RUNNER_TEMP/public" > "$RUNNER_TEMP/public-clone.log" 2>&1 || rc=$?
            echo $rc > "$RUNNER_TEMP/public-clone.rc.tmp" && mv "$RUNNER_TEMP/public-clone.rc.tmp" "$RUNNER_TEMP/public-clone.rc" ) > /dev/null 2>&1 &
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Cache the pinned export tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/harness-evals/public-export
          key: >-
            public-export-tools-${{ hashFiles('scripts/public-export/tools.lock') }}
      - name: Pinned export tools (checksum-verified)
        run: bun scripts/public-export/export.ts tools
      # The export reads the source's identities from refs/heads/main, which a pull request checkout does not create. The
      # public main is cloned first (the background step above): the reference-overlap gate drops only the common phrases its
      # harness captures, world/, harnesses/ and tasks/ hold, never those of the tree being exported.
      - name: Export tree (keyless; exit 1 is a gate verdict the next step reads)
        run: |
          for _ in $(seq 900); do [ -e "$RUNNER_TEMP/public-clone.rc" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/public-clone.log"
          [ "$(cat "$RUNNER_TEMP/public-clone.rc" 2>/dev/null)" = 0 ] || { echo "the public clone failed or did not finish within 15 minutes" >&2; exit 2; }
          git update-ref refs/heads/main HEAD
          rc=0
          bun scripts/public-export/export.ts tree --source . --rev HEAD --cutover "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out "$RUNNER_TEMP/export" --no-trufflehog --common-from "$RUNNER_TEMP/public" || rc=$?
          [ "$rc" -le 1 ]
      - name: Export gates
        run: bun scripts/public-export/ci-gate.ts --report "$RUNNER_TEMP/export/report/tree-report.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the export report (Markdown only)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-export-report
          path: ${{ runner.temp }}/export/report/tree-report.md
          if-no-files-found: ignore
      # The export commit becomes the clone's main, as it would be after the push, so a test that reads its base from main or
      # origin/main (the sealed governance checks) compares the export with itself, not with the public copy before it.
      - name: The export tree on top of the public history
        run: |
          cd "$RUNNER_TEMP/public"
          git fetch -q --no-tags "$RUNNER_TEMP/export/stage" main
          tip=$(git -c user.name=ci -c user.email=ci@invalid commit-tree FETCH_HEAD^{tree} -p HEAD -m "export tree of $GITHUB_SHA")
          git checkout -q -B main "$tip"
          git update-ref -d refs/remotes/origin/main
      # The export tree's tests run through its own scripts/run-tests.sh, the command the public repository's checks job
      # runs: every file under tests/, in the same four phases (image builders, then the proxy files one at a time, then
      # the rest with one worker per core, then the serial files alone). One bun process over the same files took 25 minutes at the median on standard-4.
      - name: Keyless install, typecheck, links and tests on the export tree
        working-directory: ${{ runner.temp }}/public
        run: env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 bash -c 'bun install --frozen-lockfile && bunx tsc --noEmit && python3 scripts/check-links.py && bash scripts/run-tests.sh'

  # Which paths changed, so the docker job runs only when the sidecar image, its build, the fake harness it drives or the
  # image tests could have changed: a pull request is compared with its base, a push to main with the commit before it.
  changes:
    runs-on: ${{ github.repository == 'garrytan/harness-evals' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      gbrain: ${{ steps.diff.outputs.gbrain }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "gbrain=true" >> "$GITHUB_OUTPUT"; echo "no base commit; running the docker job"; exit 0; fi
          changed=$(git diff --name-only "$BASE" "$GITHUB_SHA" -- gbrain/ 'world/services/gbrain*' 'runner/trial/gbrain*' 'tests/gbrain*' harnesses/_fake/ scripts/build-gbrain-image.sh .github/workflows/ci.yml)
          if [ -n "$changed" ]; then echo "gbrain=true" >> "$GITHUB_OUTPUT"; printf 'docker job runs; changed:\n%s\n' "$changed"; else echo "gbrain=false" >> "$GITHUB_OUTPUT"; echo "docker job skipped: no gbrain path changed since $BASE"; fi

  # The sidecar image from this checkout (gbrain at the pin, four keyword brains, the install bundle), then the image tests
  # with HE_GBRAIN_IMAGE set, which fail rather than skip when the image is missing. No secret: the build is keyless and the
  # embedded-brain case runs against an in-test fake embedder only when HE_GBRAIN_EMBEDDED_BRAIN names a brain, which it
  # does not here (that brain is built through the metering proxy with a key, scripts/build-gbrain-image.sh --embedded).
  docker-e2e:
    needs: changes
    if: needs.changes.outputs.gbrain == 'true'
    runs-on: ${{ github.repository == 'garrytan/harness-evals' && 'ubicloud-standard-4-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build the gbrain sidecar image from this checkout
        run: scripts/build-gbrain-image.sh --tag "harness-eval/gbrain:pr-${GITHUB_SHA::12}" --out /tmp/gbrain-build
      - name: Image tests
        run: HE_GBRAIN_IMAGE="harness-eval/gbrain:pr-${GITHUB_SHA::12}" bun test tests/gbrain-image.test.ts
      - name: Build log on failure
        if: failure()
        run: tail -60 /tmp/gbrain-build/build.log || true

  # The one result main's ruleset requires from this workflow. It runs even when a job it needs failed, and fails when any
  # of them failed or was cancelled; a skipped job passes here only because it was skipped by its own condition, since a
  # job skipped by a failed dependency leaves that dependency's failure in the list.
  ci-result:
    needs: [checks, verify, prereg, public-export, changes, docker-e2e]
    if: always()
    runs-on: ${{ github.repository == 'garrytan/harness-evals' && 'ubicloud-standard-2-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Fail when a job above failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if printf '%s' "$RESULTS" | grep -qE '"(failure|cancelled)"'; then echo "a required job failed or was cancelled"; exit 1; fi
