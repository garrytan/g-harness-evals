# Pull request text alerts, in the public repository only. Comments, reviews, review comments and issues are outside
# text that maintainers read as untrusted data: this job runs main's scripts/public-safety/check.ts --pr-text on the
# event payload's text alone and fails visibly on a hit, so a maintainer sees it and edits or hides the text. It is not
# a required check. Read-only and keyless; it checks out main, never the pull request.
name: pr-text

on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  pr-text:
    if: github.repository == 'garrytan/g-harness-evals'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: The event's text
        id: text
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            issue_comment|pull_request_review_comment) jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH" ;;
            pull_request_review) jq -r '.review.body // ""' "$GITHUB_EVENT_PATH" ;;
            issues) jq -r '.issue.title, "", (.issue.body // "")' "$GITHUB_EVENT_PATH" ;;
          esac > "$RUNNER_TEMP/text.txt"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/text.txt"; then echo "empty=false" >> "$GITHUB_OUTPUT"; else echo "empty=true" >> "$GITHUB_OUTPUT"; fi
      - name: Text gate (main's check.ts --pr-text)
        if: steps.text.outputs.empty == 'false'
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/gate"
          git archive HEAD scripts/public-safety | tar -x -C "$RUNNER_TEMP/gate"
          rc=0
          bun "$RUNNER_TEMP/gate/scripts/public-safety/check.ts" --pr-text "$RUNNER_TEMP/text.txt" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=public-safety pr-text::check.ts --pr-text exited $rc on the $GITHUB_EVENT_NAME text (1 rejected, 2 usage, 3 tool failure); a maintainer edits or hides it"
            echo "public-safety pr-text: $GITHUB_EVENT_NAME text rejected (exit $rc)" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
