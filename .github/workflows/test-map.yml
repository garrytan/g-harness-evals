# Nightly runtime test map for pull request test selection (scripts/ci/select-tests.ts). It runs on a schedule and on
# manual dispatch, only in garrytan/harness-evals, only from main, and never on a pull request, in two jobs on ephemeral
# Ubicloud runners (each VM is destroyed when its job ends):
# - map traces every test file of main's head on its own under strace -f (scripts/ci/test-map/trace.sh), builds the
#   gzipped map (scripts/ci/test-map/build-map.py) and hands it on through the Actions cache. Its token can only read, and
#   the checkout keeps no credentials, so the tests and every bun install script run with no way to write.
# - push runs no repository code: no checkout, no install. It restores the map, wraps it in one parentless commit in an
#   empty repository, and replaces the commit on the orphan branch ci-test-map with it. Only this job gets contents: write,
#   and only its final step has the token in its environment.
# Residual risk: GitHub cannot narrow contents: write to one branch, so the push job's token could write any branch or tag
# that no ruleset protects. Only the pinned cache action and git run while it exists. Main's ruleset (ci-result and
# ubicloud/checks required, no bypass) refuses a direct push to main, so what is left is the ci-test-map branch itself, and
# a wrong map there can only make a pull request run fewer tests: the full suite on ubicloud/checks still gates every merge.
# The map records the main commit it traced and when; the selector falls back to the full suite when that commit is not in
# a pull request's base or the map is over 3 days old, so a failed night costs speed, never coverage.
name: test-map

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-map
  cancel-in-progress: false

jobs:
  map:
    if: github.repository == 'garrytan/harness-evals' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubicloud-standard-16-ubuntu-2404
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: The traced commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install strace
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq strace
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Trace every test file
        run: bash scripts/ci/test-map/trace.sh --out "$RUNNER_TEMP/trace"
      - name: Build the map
        run: mkdir -p "$RUNNER_TEMP/map" && python3 scripts/ci/test-map/build-map.py --json "$RUNNER_TEMP/trace/json" --timings "$RUNNER_TEMP/trace/timings.tsv" --sha "${{ steps.sha.outputs.sha }}" --root . --out "$RUNNER_TEMP/map/test-map.json.gz"
      - name: Hand the map to the push job
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/map
          key: >-
            test-map-${{ github.run_id }}-${{ github.run_attempt }}

  push:
    needs: map
    if: github.repository == 'garrytan/harness-evals' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Take the map
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/map
          key: >-
            test-map-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      # One orphan commit holding the map, pushed over the previous one, so the branch never grows. The lease names the
      # commit read before the push (or none, the first time), so two runs can never both win. The token reaches git
      # through GIT_CONFIG_* variables, so it never appears in a process's arguments.
      - name: Replace the map on ci-test-map
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ needs.map.outputs.sha }}
          REMOTE: https://github.com/${{ github.repository }}.git
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "the map job named no traced commit" >&2; exit 1; }
          git init -q "$RUNNER_TEMP/map-commit" && cd "$RUNNER_TEMP/map-commit"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0
          old=$(git ls-remote "$REMOTE" refs/heads/ci-test-map | cut -f1)
          blob=$(git hash-object -w "$RUNNER_TEMP/map/test-map.json.gz")
          tree=$(printf '100644 blob %s\ttest-map.json.gz\n' "$blob" | git mktree)
          commit=$(GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_NAME="github-actions[bot]" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" git commit-tree "$tree" -m "Test map of main at $SHA")
          git push --force-with-lease="refs/heads/ci-test-map:$old" "$REMOTE" "$commit:refs/heads/ci-test-map"
