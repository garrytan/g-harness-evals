name: Finding question
description: A question about, or a dispute of, a published number.
body:
  - type: markdown
    attributes:
      value: |
        **Tie your question to a receipt.** Every published number comes from files under docs/benchmarks/<run>/results/. Tell us which number, which receipt you checked, and what you got.
  - type: input
    id: location
    attributes:
      label: File and line of the number
      description: Where the number is published.
      placeholder: docs/benchmarks/<run>/report.md:42
    validations:
      required: true
  - type: input
    id: receipt
    attributes:
      label: Receipt you checked
      description: A path under docs/benchmarks/<run>/results/.
      placeholder: docs/benchmarks/<run>/results/trials.jsonl
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: What you computed and how
      description: The commands, scripts or arithmetic you used, so we can repeat it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: The number you expected, and why.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: The number you got from the receipt.
    validations:
      required: true
