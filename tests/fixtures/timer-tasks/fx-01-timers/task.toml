# Fixture task for the timer tests (tests/clock-timers.test.ts). Not a counted task; kept outside tests/fixtures/tasks so no
# runner test plans it. With [clock] timers the world offers
# timer_set, timer_list and timer_cancel, and the runner delivers each timer as its own turn when the clock passes it.
id = "fx-01-timers"
slice = "multiuser"
family = "scheduled"
split = "dev"
title = "Fixture: Dana asks for a check-back in an hour; the clock moves past it"
time_budget_s = 20
actors = ["dana-okafor", "ilse-varga"]

[clock]
timers = true
end_advance_s = 7200

[[turns]]
actor = "dana-okafor"
channel = "dm"
text = "Can you check back with me in 30 minutes about the Harbourline renewal?"

[[turns]]
actor = "ilse-varga"
channel = "north-team"
text = "Morning. Anything on the QFL thread?"
