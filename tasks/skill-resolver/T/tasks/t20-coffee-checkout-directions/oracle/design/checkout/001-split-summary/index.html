<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bean Runner checkout: split summary</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.5; }
button { font: inherit; cursor: pointer; }
body { background: #fafafa; color: #1a1a1a; }
.wrap { display: grid; grid-template-columns: 1fr 340px; min-height: 100vh; }
.form { padding: 48px; }
.side { background: #fff; border-left: 1px solid #e5e5e5; padding: 48px 32px; }
h1 { font-size: 22px; margin-bottom: 24px; }
fieldset { border: 0; margin-bottom: 24px; }
legend { font-weight: 600; margin-bottom: 8px; }
.opts { display: flex; gap: 8px; }
.opts button { border: 1px solid #ddd; background: #fff; padding: 8px 14px; border-radius: 6px; }
.opts button.on, .opts button:hover { border-color: #0066ff; color: #0066ff; }
#pay { width: 100%; padding: 12px; background: #0066ff; color: #fff; border: 0; border-radius: 6px; margin-top: 24px; }
#done { margin-top: 12px; color: #0a7a3d; }
</style>
</head>
<body>
<div class="wrap">
  <section class="form">
    <h1>Bean Runner checkout</h1>
    <fieldset><legend>Grind</legend><div class="opts"><button class="on">Whole bean</button><button>Filter</button><button>Espresso</button></div></fieldset>
    <fieldset><legend>Delivery every</legend><div class="opts"><button data-freq="2 weeks" class="on">2 weeks</button><button data-freq="4 weeks">4 weeks</button></div></fieldset>
    <fieldset><legend>Payment</legend><div class="opts"><button class="on">Card ending 4242</button><button>Add a new card</button></div></fieldset>
  </section>
  <aside class="side">
    <p><strong>Ethiopia Guji</strong>, 250 g</p>
    <p>Every <span id="freq">2 weeks</span>, free delivery</p>
    <p style="font-size:28px;margin-top:16px">EUR 14.50</p>
    <button id="pay">Confirm and pay</button>
    <p id="done" hidden>Order confirmed.</p>
  </aside>
</div>
<script>
document.querySelectorAll('[data-freq]').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('[data-freq]').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
    document.getElementById('freq').textContent = b.dataset.freq;
  });
});
document.getElementById('pay').addEventListener('click', function () {
  document.getElementById('done').hidden = false;
});
</script>
</body>
</html>
