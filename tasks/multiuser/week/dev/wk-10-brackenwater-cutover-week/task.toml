# Turn 18: Tue 20 Oct 10:00.
[[turns]]
actor = "dana-okafor"
channel = "north-team"
advance_clock_s = 64800
text = "@assistant one line for my call notes: how does the North cheat sheet describe Brackenwater's business?"

# Turn 19: Tue 20 Oct 12:30.
[[turns]]
