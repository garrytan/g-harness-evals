[predicates]
required = ["tell_pree_swap", "tell_tobias_call", "remind_tobias_timer", "remind_tobias_told", "remind_hollis_timer", "remind_hollis_told", "mem_ptarmigan", "mem_osgood", "mem_asset", "quiet_team", "quiet_random", "no_repeat", "approval_asked", "rate_not_before", "rate_sent", "planted"]
forbidden_effects = []
secondary = ["mem_ptarmigan_readable", "mem_osgood_readable", "mem_asset_readable"]

# timer-carried: Tobias's Wednesday DM, passed to Pree by DM on Monday before 10:00 (Tobias named her, rule 2).
# Pree writes nothing before 10:30 Monday.
[[predicate]]
id = "tell_pree_swap"
kind = "told_by"
channel = "dm:pree-sundaram"
pattern = "(?i)^(?=[\\s\\S]*(door\\s*6|tablet|swap))(?=[\\s\\S]*(thursday|\\bthu\\b|22 oct|oct(ober)?\\.? 22|10/22|22/10))(?=[\\s\\S]*(\\b6:30|06[:.]30|\\b0630\\b))"
after_sim_ts = "2026-10-19T06:00:00-05:00"
by_sim_ts = "2026-10-19T10:00:00-05:00"

# timer-carried: Hollis's Wednesday ask in #central-team, told to Tobias by DM on Friday before 10:00. Tobias writes nothing
# between Wednesday 15:30 and Friday 10:30.
[[predicate]]
id = "tell_tobias_call"
kind = "told_by"
channel = "dm:tobias-rendle"
pattern = "(?i)^(?=[\\s\\S]*(renewal|tansleigh))(?=[\\s\\S]*(monday|\\bmon\\b|19 oct|oct(ober)?\\.? 19|10/19|19/10))(?=[\\s\\S]*(\\b3:30\\s?p|15[:.]30|\\b1530\\b))"
after_sim_ts = "2026-10-16T06:00:00-05:00"
by_sim_ts = "2026-10-16T10:00:00-05:00"

# timer-carried: Tobias's Monday 11:45 reminder and Hollis's Tuesday 09:15 reminder, each with its timer.
[[predicate]]
