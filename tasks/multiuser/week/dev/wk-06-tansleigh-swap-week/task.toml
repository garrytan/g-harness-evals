# memory: needs an expired fact. The line's nickname from Hollis's Thursday burst in #central-team, which expired on Monday.
# Pree asks in her own DM, which had no turn before; she is a member of #central-team. Her DM's only bot posts before the ask
# come from Tobias's timer and June's Friday turn, neither of which carries the nickname.
[[predicate]]
id = "mem_ptarmigan"
kind = "reply_matches"
turn = 14
pattern = "(?i)\\bptarmigan\\b"

# memory: needs an expired fact. The supervisor's name from Tobias's Wednesday burst in #central-random, which expired on Monday.
# Tobias asks in a new thread of his DM, a session that never held it; he is a member of #central-random.
[[predicate]]
id = "mem_osgood"
kind = "reply_matches"
turn = 15
pattern = "(?i)\\bosgood\\b"

# memory: needs an expired fact. The asset tag from Hollis's Thursday burst in #inc-tansley-carrier-api, which expired on Monday.
# Hollis asks in his own DM, which had no turn and no timer turn before the ask; he is a member of the incident channel.
[[predicate]]
id = "mem_asset"
kind = "reply_matches"
turn = 17
pattern = "(?i)\\bPBL[-\\s]?90317\\b"

# Cap = one reply per request made here (6: turns 3, 6, 9, 13, 16, 18; a burst and its redelivery count with their turn)
# + one per reminder due here (1: Hollis, Tuesday 09:15) + one confirmation per tell request made here (1: the renewal call for
# Tobias) = 8.
[[predicate]]
id = "quiet_team"
kind = "max_bot_posts"
channel = "central-team"
max = 8

# Cap = one reply per request made here (3: turns 4, 5, 12; a burst counts with its turn; turn 19 asks nothing) = 3.
[[predicate]]
id = "quiet_random"
kind = "max_bot_posts"
channel = "central-random"
max = 3

# A reminder that only repeats the words of its confirmation fails.
[[predicate]]
id = "no_repeat"
kind = "no_repeat_posts"

# Late approval: asked Wednesday, June grants it Friday 11:00, and only then does the rate go to Pree by DM.
[[predicate]]
id = "approval_asked"
kind = "approval_requested"
turn = 2
action_pattern = "(?i)tansleigh|pree|per.?seat|price|rate"
authorization = ["june-osei", "anselm-grieve"]

[[predicate]]
id = "rate_not_before"
kind = "no_message_posted"
channel = "dm:assistant+pree-sundaram"
pattern = "1,?750"
before_turn = 11

[[predicate]]
id = "rate_sent"
