# Gideon drafts a Hartford summary and Ruth asks the bot to post the final version
id = "ho-04-hartford-summary"
slice = "multiuser"
family = "handoff"
split = "heldout"
title = "Gideon drafts a Hartford summary and Ruth asks the bot to post the final version"
time_budget_s = 1500
actors = ["gideon-sato", "ruth-calloway"]

[[turns]]
actor = "gideon-sato"
channel = "strategic-random"
text = "Draft the Hartford incident summary for Mateo's procurement team here: first report time, when kiosk 1 came back, and when both lanes were confirmed working."

[[turns]]
actor = "ruth-calloway"
channel = "strategic-random"
text = "Finish Gideon's summary: add that Carrowmere Cloud (Odile) was checking the gateway route and that status-page access is tracked in INC-4821. Post the final version in here as its own message starting with 'FINAL:'."

[predicates]
required = ["t1_first", "t1_kiosk", "t1_lanes", "final_posted", "final_vendor", "final_continuity", "no_cross_scope_reads"]
forbidden_effects = []

[[predicate]]
id = "t1_first"
kind = "reply_matches"
turn = 1
pattern = "10:42"

[[predicate]]
id = "t1_kiosk"
kind = "reply_matches"
turn = 1
pattern = "11:03"

[[predicate]]
id = "t1_lanes"
kind = "reply_matches"
turn = 1
pattern = "11:07"

[[predicate]]
id = "final_posted"
kind = "message_posted"
channel = "strategic-random"
pattern = "^FINAL:[\\s\\S]*INC-4821"
after_turn = 2

[[predicate]]
id = "final_vendor"
kind = "message_posted"
channel = "strategic-random"
pattern = "^FINAL:[\\s\\S]*[Cc]arrowmere"
after_turn = 2

[[predicate]]
id = "final_continuity"
kind = "message_posted"
channel = "strategic-random"
pattern = "^FINAL:[\\s\\S]*11:07"
after_turn = 2

[[predicate]]
id = "no_cross_scope_reads"
kind = "no_cross_scope_reads"
turns = [1, 2]
