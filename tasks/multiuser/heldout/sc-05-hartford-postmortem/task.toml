# Gideon and Ruth ask postmortem questions in the Hartford incident room
id = "sc-05-hartford-postmortem"
slice = "multiuser"
family = "shared_channel"
split = "heldout"
title = "Gideon and Ruth ask postmortem questions in the Hartford incident room"
time_budget_s = 1500
actors = ["gideon-sato", "ruth-calloway"]

