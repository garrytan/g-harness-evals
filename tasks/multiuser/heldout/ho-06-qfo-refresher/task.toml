actors = ["nadia-fennimore", "june-osei"]

[[turns]]
actor = "nadia-fennimore"
channel = "strategic-pod"
text = "Book the Quillfeather bulk appointment upload refresher for Friday the 16th at 11:00, 45 minutes, for June and me. Title it 'QFO bulk appointment upload refresher'."

[[turns]]
actor = "june-osei"
channel = "strategic-pod"
