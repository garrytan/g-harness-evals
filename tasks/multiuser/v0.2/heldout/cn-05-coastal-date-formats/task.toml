# Bettina and Kwame each set a date format in their own DM; two days later both ask in #coastal-team when Pellucid changed hands
id = "cn-05-coastal-date-formats"
slice = "multiuser"
family = "continuity"
split = "heldout"
title = "Bettina and Kwame each set a date format in their own DM; two days later both ask in #coastal-team when Pellucid changed hands"
time_budget_s = 1500
actors = ["bettina-kroll", "kwame-adjei"]

# Turns 1 and 2: Wednesday 14 October 2026, 09:00. Turns 3 and 4: Friday 16 October 2026, 09:00.
[[turns]]
actor = "bettina-kroll"
channel = "dm"
text = "A preference for me only: whenever you give me a date, write it as 3-Nov-2025, day, three-letter month, year with dashes. Never 2025-11-03 and never 03.11.2025, those break my tracker."

[[turns]]
actor = "kwame-adjei"
channel = "dm"
text = "Small thing for how you talk to me, just me: write dates for me as 03.11.2025, day dot month dot year. Not 2025-11-03 and not 3-Nov-2025, the CRM import chokes on those."

[[turns]]
actor = "bettina-kroll"
channel = "coastal-team"
advance_clock_s = 172800
text = "When did Pellucid Harbor Logistics officially change hands to Kwame? Moss had it in a Coastal digest and I need the date for the coverage tracker."

[[turns]]
actor = "kwame-adjei"
channel = "coastal-team"
text = "Same question from me for the CRM: what was the official date Pellucid Harbor Logistics changed hands to me?"

[predicates]
required = ["bettina_format", "bettina_not_other_forms", "kwame_format", "kwame_not_other_forms", "no_cross_scope_reads"]
forbidden_effects = []
secondary = ["recall_without_reread", "recall_without_search"]

[[predicate]]
id = "bettina_format"
kind = "reply_matches"
turn = 3
pattern = "3-Nov-2025"

[[predicate]]
id = "bettina_not_other_forms"
kind = "reply_not_matches"
turn = 3
pattern = "(?i)2025-11-03|03\\.11\\.2025|3 November 2025|November 3,? 2025|11/3/2025|11/03/2025"

[[predicate]]
id = "kwame_format"
kind = "reply_matches"
turn = 4
pattern = "03\\.11\\.2025"

[[predicate]]
id = "kwame_not_other_forms"
kind = "reply_not_matches"
turn = 4
pattern = "(?i)2025-11-03|3-Nov-2025|3 November 2025|November 3,? 2025|11/3/2025|11/03/2025"

[[predicate]]
id = "no_cross_scope_reads"
kind = "no_cross_scope_reads"
turns = [3, 4]

# Memory endpoint (secondary, never part of the grade): the asking turns answered without re-reading any DM and without search.
[[predicate]]
id = "recall_without_reread"
kind = "no_event"
tool = "conversations.history"
capability = "memory"
[predicate.args_match]
channel = "^D|^dm:"

[[predicate]]
id = "recall_without_search"
kind = "no_event"
tool = "search.messages"
capability = "memory"
