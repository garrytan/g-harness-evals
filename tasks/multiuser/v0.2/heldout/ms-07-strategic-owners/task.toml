[[predicate]]
id = "vtm_owner"
kind = "reply_matches"
turn = 1
pattern = "(?i)mobility[^.\\n]*gideon|gideon[^.\\n]*mobility"

[[predicate]]
id = "orlavine_owner"
kind = "reply_matches"
turn = 1
pattern = "(?i)orlavine[^.\\n]*gideon|gideon[^.\\n]*orlavine"

[[predicate]]
id = "quillfeather_pod"
kind = "reply_matches"
turn = 1
pattern = "(?i)quillfeather[^.\\n]*(pod|shared|no single|team)"

[[predicate]]
id = "vtg_date"
kind = "reply_matches"
turn = 1
