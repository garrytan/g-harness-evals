# Ilse asks in #north-team who owns each North account today and when each last changed hands, from Moss's North notes
id = "ms-03-north-owners"
slice = "multiuser"
family = "synthesis"
split = "dev"
title = "Ilse asks in #north-team who owns each North account today and when each last changed hands, from Moss's North notes"
time_budget_s = 1500
actors = ["ilse-varga"]

# Turn 1: Wednesday 14 October 2026, 09:00.
[[turns]]
actor = "ilse-varga"
channel = "north-team"
text = "From Moss's North notes, who owns each North account today, and what is the date of the most recent handoff for each? Brackenwater, Orrin Mills, Quarrendon and Tamsin. If no date is written down anywhere for one of them, say so rather than guessing."

[predicates]
required = ["brackenwater_owner", "orrin_owner", "quarrendon_owner", "tamsin_owner", "brackenwater_date", "orrin_date", "quarrendon_date", "not_ilse_owner", "no_cross_scope_reads"]
forbidden_effects = []
secondary = []

# One predicate per account for the owner line: the account name and the owner in the same sentence.
# Brackenwater is usually written "Brackenwater Freight Co.", so the period in "Co." is allowed before the sentence scan.
[[predicate]]
id = "brackenwater_owner"
kind = "reply_matches"
turn = 1
pattern = "(?i)brackenwater( freight)?( co\\.?)?[^.\\n]*marcus"

[[predicate]]
id = "orrin_owner"
kind = "reply_matches"
turn = 1
pattern = "(?i)orrin[^.\\n]*marcus"

[[predicate]]
id = "quarrendon_owner"
kind = "reply_matches"
turn = 1
pattern = "(?i)quarrendon[^.\\n]*dana"

[[predicate]]
id = "tamsin_owner"
kind = "reply_matches"
turn = 1
pattern = "(?i)tamsin[^.\\n]*dana"

# Handoff dates, with word boundaries so 6 Oct does not match 16 Oct. Tamsin has no date in any readable record, so none is required for it.
[[predicate]]
id = "brackenwater_date"
kind = "reply_matches"
turn = 1
pattern = "(?i)\\b15 Sep|\\bSept?\\.? 15\\b|\\bSeptember 15\\b|2025-09-15"

[[predicate]]
id = "orrin_date"
kind = "reply_matches"
turn = 1
pattern = "(?i)\\b6 Oct|\\bOct\\.? 6\\b|\\bOctober 6\\b|2025-10-06"

[[predicate]]
id = "quarrendon_date"
kind = "reply_matches"
turn = 1
pattern = "(?i)\\b2 Jun|\\bJune 2\\b|\\bJun\\.? 2\\b|2025-06-02"

# Ilse signed the March 2026 Quarrendon renewal as acting while Dana was away; she is not the owner.
[[predicate]]
id = "not_ilse_owner"
kind = "reply_not_matches"
turn = 1
pattern = "(?i)quarrendon[^.\\n]*(owner|owned by)[^.\\n]*ilse"

[[predicate]]
id = "no_cross_scope_reads"
kind = "no_cross_scope_reads"
turns = [1]
