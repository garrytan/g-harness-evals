# Turns 1 and 2: Wednesday 14 October 2026, 09:00. Turn 3: Monday 19 October 2026, 09:00.
[[turns]]
actor = "hollis-mbeki"
channel = "central-team"
text = "For your records, no action needed: Tansley Parcel moves to Tobias from next week. I will update the territory plan when I get a minute."

[[turns]]
