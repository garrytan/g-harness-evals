channel = "central-team"
text = "Scratch that, for your records: I mixed up the two TPs again. I meant Tansleigh Packaging stays with Tobias. Tansley Parcel stays with Pree, nothing changes there."

[[turns]]
actor = "hollis-mbeki"
channel = "central-team"
advance_clock_s = 432000
text = "Who owns Tansley Parcel as of today? I want the on-call sheet to name the right person."

[predicates]
