<svg xmlns="http://www.w3.org/2000/svg" width="760" height="302" viewBox="0 0 760 302" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>qm, claude-opus-5-5: avoidable-looking spend</title>
<rect width="760" height="302" fill="#ffffff"/>
<text x="12" y="22" font-size="14" font-weight="bold">qm, claude-opus-5-5: avoidable-looking spend</text>
<text x="12" y="40" fill="#555555">cell qm-pi-opus-none-mu-v03-dev, 40 trials; bars are per-trial means, whiskers task-clustered 95% intervals</text>
<text x="12" y="70" fill="#555555">per trial, tokens</text>
<text x="202" y="99" text-anchor="end">Cache misses on a repeated prefix</text>
<rect x="210" y="86" width="1" height="18" fill="#4a7ab5"/>
<line x1="210" y1="95" x2="210" y2="95" stroke="#222222"/>
<line x1="210" y1="89" x2="210" y2="101" stroke="#222222"/>
<line x1="210" y1="89" x2="210" y2="101" stroke="#222222"/>
<text x="650" y="99">0 tokens</text>
<text x="202" y="125" text-anchor="end">Cache writes never read</text>
<rect x="210" y="112" width="343.53" height="18" fill="#4a7ab5"/>
<line x1="489.9" y1="121" x2="626" y2="121" stroke="#222222"/>
<line x1="489.9" y1="115" x2="489.9" y2="127" stroke="#222222"/>
<line x1="626" y1="115" x2="626" y2="127" stroke="#222222"/>
<text x="650" y="125">3,694 tokens</text>
<text x="12" y="148" fill="#555555">per trial, bytes</text>
<text x="202" y="177" text-anchor="end">Schemas of tools never called</text>
<rect x="210" y="164" width="344.4" height="18" fill="#4a7ab5"/>
<line x1="493.95" y1="173" x2="626" y2="173" stroke="#222222"/>
<line x1="493.95" y1="167" x2="493.95" y2="179" stroke="#222222"/>
<line x1="626" y1="167" x2="626" y2="179" stroke="#222222"/>
<text x="650" y="177">153,735 bytes</text>
<text x="202" y="203" text-anchor="end">Tool results sent again</text>
<rect x="210" y="190" width="3.55" height="18" fill="#4a7ab5"/>
<line x1="211.24" y1="199" x2="216.77" y2="199" stroke="#222222"/>
<line x1="211.24" y1="193" x2="211.24" y2="205" stroke="#222222"/>
<line x1="216.77" y1="193" x2="216.77" y2="205" stroke="#222222"/>
<text x="650" y="203">1,587 bytes</text>
<text x="12" y="226" fill="#555555">per trial, USD</text>
<text x="202" y="255" text-anchor="end">Retries</text>
<rect x="210" y="242" width="1" height="18" fill="#4a7ab5"/>
<line x1="210" y1="251" x2="210" y2="251" stroke="#222222"/>
<line x1="210" y1="245" x2="210" y2="257" stroke="#222222"/>
<line x1="210" y1="245" x2="210" y2="257" stroke="#222222"/>
<text x="650" y="255">$0.0000</text>
<text x="202" y="281" text-anchor="end">Side calls</text>
<rect x="210" y="268" width="264.8" height="18" fill="#4a7ab5"/>
<line x1="340.46" y1="277" x2="626" y2="277" stroke="#222222"/>
<line x1="340.46" y1="271" x2="340.46" y2="283" stroke="#222222"/>
<line x1="626" y1="271" x2="626" y2="283" stroke="#222222"/>
<text x="650" y="281">$0.0055</text>
</svg>
