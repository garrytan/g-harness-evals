<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>openclaw, claude-opus-5-5: growth by user turn</title>
<rect width="760" height="330" fill="#ffffff"/>
<text x="12" y="22" font-size="14" font-weight="bold">openclaw, claude-opus-5-5: growth by user turn</text>
<text x="12" y="40" fill="#555555">cell openclaw-opus-none-mu-v03-dev, 40 trials; a later turn holds only the trials that reached it</text>
<line x1="80" y1="290" x2="560" y2="290" stroke="#999999"/>
<line x1="80" y1="76" x2="80" y2="290" stroke="#999999"/>
<text x="74" y="294" text-anchor="end" fill="#555555">0</text>
<text x="74" y="240.5" text-anchor="end" fill="#555555">20,000</text>
<text x="74" y="187" text-anchor="end" fill="#555555">40,000</text>
<text x="74" y="133.5" text-anchor="end" fill="#555555">60,000</text>
<text x="74" y="80" text-anchor="end" fill="#555555">80,000</text>
<text x="80" y="306" text-anchor="middle" fill="#555555">turn 1</text>
<text x="240" y="306" text-anchor="middle" fill="#555555">turn 2</text>
<text x="400" y="306" text-anchor="middle" fill="#555555">turn 3</text>
<text x="560" y="306" text-anchor="middle" fill="#555555">turn 4</text>
<text x="80" y="64" fill="#555555">input tokens per request</text>
<polyline fill="none" stroke="#4a7ab5" stroke-width="2" points="80,221.1 240,216.15 400,200.57 560,203.11"/>
<circle cx="80" cy="221.1" r="3" fill="#4a7ab5"/>
<circle cx="240" cy="216.15" r="3" fill="#4a7ab5"/>
<circle cx="400" cy="200.57" r="3" fill="#4a7ab5"/>
<circle cx="560" cy="203.11" r="3" fill="#4a7ab5"/>
<rect x="576" y="76" width="12" height="12" fill="#4a7ab5"/>
<text x="594" y="87">mean per request</text>
<polyline fill="none" stroke="#c0504d" stroke-width="2" points="80,211.4 240,206.24 400,172.65 560,187.45"/>
<circle cx="80" cy="211.4" r="3" fill="#c0504d"/>
<circle cx="240" cy="206.24" r="3" fill="#c0504d"/>
<circle cx="400" cy="172.65" r="3" fill="#c0504d"/>
<circle cx="560" cy="187.45" r="3" fill="#c0504d"/>
<rect x="576" y="96" width="12" height="12" fill="#c0504d"/>
<text x="594" y="107">last request of the turn</text>
</svg>
