<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>hermes, gpt-6.1-sol: growth by user turn</title>
<rect width="760" height="330" fill="#ffffff"/>
<text x="12" y="22" font-size="14" font-weight="bold">hermes, gpt-6.1-sol: growth by user turn</text>
<text x="12" y="40" fill="#555555">cell hermes-sol-none-mu-v03-dev, 40 trials; a later turn holds only the trials that reached it</text>
<line x1="80" y1="290" x2="560" y2="290" stroke="#999999"/>
<line x1="80" y1="76" x2="80" y2="290" stroke="#999999"/>
<text x="74" y="294" text-anchor="end" fill="#555555">0</text>
<text x="74" y="240.5" text-anchor="end" fill="#555555">10,000</text>
<text x="74" y="187" text-anchor="end" fill="#555555">20,000</text>
<text x="74" y="133.5" text-anchor="end" fill="#555555">30,000</text>
<text x="74" y="80" text-anchor="end" fill="#555555">40,000</text>
<text x="80" y="306" text-anchor="middle" fill="#555555">turn 1</text>
<text x="240" y="306" text-anchor="middle" fill="#555555">turn 2</text>
<text x="400" y="306" text-anchor="middle" fill="#555555">turn 3</text>
<text x="560" y="306" text-anchor="middle" fill="#555555">turn 4</text>
<text x="80" y="64" fill="#555555">input tokens per request</text>
<polyline fill="none" stroke="#4a7ab5" stroke-width="2" points="80,207.99 240,204.19 400,192.43 560,197.96"/>
<circle cx="80" cy="207.99" r="3" fill="#4a7ab5"/>
<circle cx="240" cy="204.19" r="3" fill="#4a7ab5"/>
<circle cx="400" cy="192.43" r="3" fill="#4a7ab5"/>
<circle cx="560" cy="197.96" r="3" fill="#4a7ab5"/>
<rect x="576" y="76" width="12" height="12" fill="#4a7ab5"/>
<text x="594" y="87">mean per request</text>
<polyline fill="none" stroke="#c0504d" stroke-width="2" points="80,194.74 240,192.64 400,179.38 560,186.04"/>
<circle cx="80" cy="194.74" r="3" fill="#c0504d"/>
<circle cx="240" cy="192.64" r="3" fill="#c0504d"/>
<circle cx="400" cy="179.38" r="3" fill="#c0504d"/>
<circle cx="560" cy="186.04" r="3" fill="#c0504d"/>
<rect x="576" y="96" width="12" height="12" fill="#c0504d"/>
<text x="594" y="107">last request of the turn</text>
</svg>
