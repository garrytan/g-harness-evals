# Route rows for an OpenAI cell (HE_MODEL_BASE_URL ends in /openai): a custom OpenAI Responses provider on the metering
# proxy at <base>/v1.
- id: agent-default-model
  config:
    provider: he-openai
    model: @MODEL@
- id: llm-pi-ai
  config:
    providers:
      he-openai:
        displayName: harness-evals metering proxy (openai)
        apiKeyEnv: HE_MODEL_API_KEY
        api: openai-responses
        baseURL: @BASE_URL_V1@
        reasoning: high
        models:
          - id: @MODEL@
            maxTokens: 128000
            reasoningEfforts:
              high: high
