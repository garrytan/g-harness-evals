# Hermes Agent config for one headless trial on an OpenRouter cell (DeepSeek V4.1
# Flash 1017). Copied to $HERMES_HOME/config.yaml (under /harness-state) by
# adapter.sh when HE_MODEL_BASE_URL ends in /openrouter. The metering proxy
# serves OpenRouter as OpenAI Chat Completions and pins every request to
# DeepSeek's own endpoint, so the model runs on Hermes's custom-endpoint provider
# (transport chat_completions) through the custom_providers entry below; the
# adapter selects it with --provider custom:openrouter-proxy. Secrets are not
# here: the adapter exports OPENAI_API_KEY (the per-trial proxy token) and
# OPENAI_BASE_URL (the proxy plus /v1), which Hermes expands into this file at
# load time. On a custom endpoint Hermes sends no output cap of its own and no
# reasoning object, so extra_body adds both to the agent turn: OpenRouter's
# reasoning {effort: high} (DeepSeek offers none, low, high and max) and
# max_completion_tokens 128000, the cap the OpenAI and Particle cells run under.
# DeepSeek thinking mode needs an earlier tool-call turn's reasoning passed back:
# Hermes does that itself for any model id containing "deepseek" (the
# reasoning_content echo rule in agent/message_sanitization.py at the pin).
# Everything else is as in config.yaml.
_config_version: 46

model:
  provider: "custom:openrouter-proxy"
  default: "deepseek/deepseek-v4.1-flash-1017"
  base_url: "${OPENAI_BASE_URL}"
  # DeepSeek V4.1 Flash 1017's window on the DeepSeek endpoint (openrouter.ai/api/v1/models/deepseek/deepseek-v4.1-flash-1017/endpoints).
  # Without it Hermes asks the endpoint's /models and falls back to 256,000 (agent/model_metadata.py).
  context_length: 1048576

custom_providers:
  - name: "openrouter-proxy"
    base_url: "${OPENAI_BASE_URL}"
    key_env: "OPENAI_API_KEY"
    extra_body:
      reasoning:
        effort: "high"
      max_completion_tokens: 128000

# With agent.reasoning_effort unset, Hermes's custom-endpoint profile sends its own reasoning_effort medium beside
# extra_body (agent/reasoning_params.py unset_reasoning_default at the pin), so the request would carry two efforts.
# Setting it to high makes both say high.
agent:
  reasoning_effort: "high"

terminal:
  backend: "local"
  cwd: "/workspace"
  timeout: 180
  home_mode: "profile"

display:
  streaming: false

# Nothing that needs a person: no update checks, no telemetry prompts.
auto_update: false
check_for_updates: false

# No lazy pip installs at turn time (Bedrock's boto3, edge-tts): the trial
# network has no package index, and no task uses those features (HARN-13).
security:
  allow_lazy_installs: false
