# gitleaks configuration for the public-safety gate (scripts/public-safety). The default rules apply in full; the
# allowlist below only removes findings that are not credentials. The gate writes every blob under an opaque file name,
# so path-scoped allowances cannot apply here: a proven false positive in one file gets a blob-bound allow.json entry.
title = "harness-evals public safety"

[extend]
useDefault = true

[[allowlists]]
description = "Per-trial proxy keys are logged as trial-token:<trial id>; the bearer token is never logged, and the tests' trial-token:<id>.<hex> values are fixtures"
regexTarget = "match"
regexes = ['''^trial-token:[A-Za-z0-9._-]+["']?$''']

[[allowlists]]
description = "Receipts before 2026-10-26 logged the trial key as sk-trial-<trial id>, the trial id behind a fixed prefix (runner/README.md, Proxy slot)"
regexTarget = "secret"
regexes = ['''^sk-trial-[A-Za-z0-9._-]+$''']

[[allowlists]]
description = "Provider prompt-cache session ids in captured request bodies, not credentials"
regexTarget = "match"
regexes = ['''^prompt_cache_key":"[A-Za-z0-9_-]+"$''']

[[allowlists]]
description = "The skill-resolver stand-in's tokenizer name, a fixed label of how it counts block tokens (scripts/skill-resolver/gbrain-stub.ts TOKENIZER); the exact string only, not a credential"
regexTarget = "secret"
regexes = ['''^he-stub-utf8-bytes-div-4$''']

[[allowlists]]
description = "Metering-proxy slot names in the MCP tools-at-scale trial list (meter_key: request id, rung, optional gbrain arm, a 7-character random suffix that keeps slots unique); a ledger slot name, not a credential"
regexTarget = "match"
regexes = ['''^(?:m?e?t?e?r?_)?key":"(?:r|t|tr|g)-[0-9]{3}[a-z]?__r[0-9]{2,3}(?:__[a-z0-9-]+)?(?:__[A-Za-z0-9]{1,7})?"?$''']

[[allowlists]]
description = "Synthetic values in the gbrain leak tests' leak-preflight records (runner/trial/gbrain-leak-preflight.ts): each token or writer_token field names the gbrain token an asker used (he-member-<name>, member-<name>, trial-leak-preflight-<arm>-<split>, public-only), never its value, and each secret field is the scripted reply marker PFS<seed><n>Z or N; the same values .gstack/pregate.json allows for these records (#617, #621), the exact value only"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^(?:(?:he-)?member-[a-z]{2,16}(?:-[a-z]{2,16})?|trial-leak-preflight-(?:open|member-sources)-(?:dev|heldout)|public-only|PFS[0-9A-Z]{1,7}[0-9]{1,3}[ZN])$''']
