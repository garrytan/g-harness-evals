# gitleaks configuration for the public-safety gate (scripts/public-safety). The default rules apply in full; the
# allowlist below only removes findings that are not credentials. The gate writes every blob under an opaque file name,
# so path-scoped allowances cannot apply here: a proven false positive in one file gets a blob-bound allow.json entry.
title = "harness-evals public safety"

[extend]
useDefault = true

[[allowlists]]
description = "Per-trial proxy keys are logged as trial-token:<trial id>; the bearer token is never logged, and the tests' trial-token:<id>.<hex> values are fixtures"
regexTarget = "match"
targetRules = ["generic-api-key"]
regexes = ['''^trial-token:[A-Za-z0-9._-]+["']?$''']

[[allowlists]]
description = "Receipts before 2026-10-26 logged the trial key as sk-trial-<trial id>, the trial id behind a fixed prefix (runner/README.md, Proxy slot)"
regexTarget = "secret"
regexes = ['''^sk-trial-[A-Za-z0-9._-]+$''']

[[allowlists]]
description = "Provider prompt-cache session ids in captured request bodies, not credentials"
regexTarget = "match"
regexes = ['''^prompt_cache_key":"[A-Za-z0-9_-]+"$''']

[[allowlists]]
description = "The skill-resolver stand-in's tokenizer name, a fixed label of how it counts block tokens (scripts/skill-resolver/gbrain-stub.ts TOKENIZER); the exact string only, not a credential"
regexTarget = "secret"
regexes = ['''^he-stub-utf8-bytes-div-4$''']

[[allowlists]]
description = "Metering-proxy slot names in the MCP tools-at-scale trial list (meter_key: request id, rung, optional gbrain arm, a 7-character random suffix that keeps slots unique); a ledger slot name, not a credential"
regexTarget = "match"
regexes = ['''^(?:m?e?t?e?r?_)?key":"(?:r|t|tr|g)-[0-9]{3}[a-z]?__r[0-9]{2,3}(?:__[a-z0-9-]+)?(?:__[A-Za-z0-9]{1,7})?"?$''']

[[allowlists]]
description = "Synthetic values in the gbrain leak tests' leak-preflight records (runner/trial/gbrain-leak-preflight.ts): each token or writer_token field names the gbrain token an asker used (he-member-<name>, member-<name>, trial-leak-preflight-<arm>-<split>, public-only), never its value, and each secret field is the scripted reply marker PFS<seed><n>Z or N; the same values .gstack/pregate.json allows for these records (#617, #621), the exact value only"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^(?:(?:he-)?member-[a-z]{2,16}(?:-[a-z]{2,16})?|trial-leak-preflight-(?:open|member-sources)-(?:dev|heldout)|public-only|PFS[0-9A-Z]{1,7}[0-9]{1,3}[ZN])$''']

# gitleaks' generic-api-key rule drops a candidate that contains one of its stopwords ("vpn", "md5", "yaml", "dead", ...),
# so a token written into a digest field can pass it by chance. These two rules have no stopwords and no entropy floor:
# every ingest_tokens_sha256 value is refused, in JSON, in JSON escaped inside a string (a JSONL line or a session log)
# and as an unquoted YAML value, and the committed records' 64-hex digests pass only through their blob-bound allow.json
# entries. The one exception is the literal pattern text [0-9a-f]{64} that configs and tests use to describe a digest.
# A key spelled with unicode escapes is refused too: the gate runs gitleaks at its default decode depth, which decodes them.
[[rules]]
id = "he-ingest-tokens-digest"
description = "An ingest_tokens_sha256 value in JSON, plain or escaped inside a string: only a committed record's digest passes, through its blob-bound allow.json entry"
regex = '''\\?"ingest_tokens_sha256\\?"\s*:\s*\\?"([^"\\]*)'''
secretGroup = 1
keywords = ["ingest_tokens_sha256"]

[[rules.allowlists]]
description = "The literal regex text that describes a digest in configs and tests, not a value"
regexTarget = "secret"
regexes = ['''^\[0-9a-f\]\{64\}$''']

[[rules]]
id = "he-ingest-tokens-digest-yaml"
description = "An unquoted or quoted YAML ingest_tokens_sha256 value on its own line: only a committed record's digest passes, through its blob-bound allow.json entry"
regex = '''(?m)^\s*ingest_tokens_sha256\s*:\s*['"]?([A-Za-z0-9_+/=.-]{8,})['"]?\s*(?:#.*)?$'''
secretGroup = 1
keywords = ["ingest_tokens_sha256"]

# Tokens this repository's tools mint. gitleaks' generic rule catches them only beside a key-like name, and skips any that
# contain one of its stopwords ("dead", "cafe", "hero", ...), so each shape has its own rule with no stopwords and no
# entropy floor (tests/public-safety-minted-tokens.test.ts). Provider key shapes are PS-KEY-SHAPE in rules.json. A bare
# 64-hex or base64 token with no name beside it is not refused: that would take a broad rule that also flags every digest.
[[rules]]
id = "he-trial-token"
description = "A metering-proxy trial token, trial-token:<trial id>.<32 hex>, the id any run of non-space characters such as <run>/<cell>/<task>/rN (runner/trial/proxy.ts trialToken, scripts/frontier-harbor/broker.ts, scripts/anatomy/count-tokens.ts)"
regex = '''trial-token:[^\s"'\\]*?\.([0-9a-f]{32})\b'''
secretGroup = 1
keywords = ["trial-token:"]

[[rules.allowlists]]
description = "Made-up fixture suffixes: 0123...f twice, 0011...ff, all zeros with a short tail, or one repeated character or pair"
regexTarget = "secret"
regexes = ['''^(?:(?:0123456789abcdef){2}|00112233445566778899aabbccddeeff|0{24,}[0-9a-f]{0,8}|(?:ab)+|a+|b+|c+|d+|e+|f+|1+|2+|3+|4+|5+|6+|7+|8+|9+)$''']

[[rules]]
id = "he-judge-token"
description = "A QM judge-shard slot token, judge-<role>:<run id>.<32 hex>, the role primary or secondary (harnesses/qm/gstack/judge-shard.ts)"
regex = '''\bjudge-[A-Za-z0-9]+:[^\s"'\\]*?\.([0-9a-f]{32})\b'''
secretGroup = 1
keywords = ["judge-"]

[[rules.allowlists]]
description = "Made-up fixture suffixes, as for he-trial-token"
regexTarget = "secret"
regexes = ['''^(?:(?:0123456789abcdef){2}|00112233445566778899aabbccddeeff|0{24,}[0-9a-f]{0,8}|(?:ab)+|a+|b+|c+|d+|e+|f+|1+|2+|3+|4+|5+|6+|7+|8+|9+)$''']

[[rules]]
id = "he-laneb-token"
description = "A Lane B proxy session token, laneb-<48 hex> (scripts/gstack-laneb/pinned/quick/laneb/runner/proxy.ts)"
regex = '''\blaneb-([0-9a-f]{48})\b'''
secretGroup = 1
keywords = ["laneb-"]

[[rules]]
id = "he-proxy-bind-token"
description = "The 64-hex token a proxy slot is bound with, as the token field of a /__proxy/bind body (scripts/gstack-laneb/vm-run.sh)"
regex = '''\\?"token\\?"\s*:\s*\\?"([0-9a-f]{64})\\?"'''
secretGroup = 1
keywords = ["token"]

[[rules]]
id = "he-proxy-control-token"
description = "A proxy control or slot token beside its name: the x-proxy-control header, SHOOTOUT_PROXY_CONTROL_TOKEN, HE_LANEB_UPSTREAM_TOKEN, control_token, controlToken, the --control-token argument (runner/trial/proxy.ts) or slot_token"
regex = '''(?i)(?:x-proxy-control|proxy_control_token|laneb_upstream_token|control[-_]?token|slot_token)\\?["']?(?:\s*[:=]\s*|\s+)\\?["']?([A-Za-z0-9_-]{16,})'''
secretGroup = 1
keywords = ["proxy-control", "proxy_control", "upstream_token", "control_token", "control-token", "controltoken", "slot_token"]

[[rules.allowlists]]
description = "A placeholder: an environment variable name"
regexTarget = "secret"
regexes = ['''^[A-Z][A-Z0-9_]+$''']

[[rules]]
id = "he-bearer-token"
description = "A value sent as an Authorization bearer credential in a captured request or log; the proxy and slot tokens ride here with no other name beside them"
regex = '''(?i)\bauthorization\\?["']?\s*[:=,]\s*\\?["']?bearer\s+([A-Za-z0-9._~+/:-]{16,})'''
secretGroup = 1
keywords = ["bearer"]

[[rules.allowlists]]
description = "Documented placeholders: an environment variable name (Bearer HE_MODEL_API_KEY) or dashed lowercase words (Bearer world-token-golden)"
regexTarget = "secret"
regexes = ['''^[A-Z][A-Z0-9_]+$''', '''^[a-z]+(?:-[a-z]+)+$''']

[[rules.allowlists]]
description = "A trial token sent as a bearer value: he-trial-token above judges it, so a real suffix is still refused and a fixture suffix passes"
regexTarget = "secret"
regexes = ['''^trial-token:''']
